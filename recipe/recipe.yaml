context:
  version: "0.7.1"

package:
  name: typst-zero
  version: ${{ version }}

source:
  url: https://github.com/Mc-Zen/zero/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4c6a164c1ef05d0a07c9a816f1c1ba0e511748fe463ec99365a719e930002bba

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p "$TYPST_PACKAGE_PATH/preview/zero/${{ version }}"
    - cp -r src typst.toml README.md LICENSE* "$TYPST_PACKAGE_PATH/preview/zero/${{ version }}/"

requirements:
  host:
    - typst
  run:
    - typst >=0.12.0

tests:
  - package_contents:
      files:
        - share/typst/packages/preview/zero/${{ version }}/typst.toml
        - share/typst/packages/preview/zero/${{ version }}/src/zero.typ
  - script:
      # Use an empty package cache so the test fails if typst downloads the package instead of using the local one
      - export TYPST_PACKAGE_CACHE_PATH=$PWD/typst-cache
      - typst compile test.typ test.pdf
      - test -f test.pdf
      - test ! -e typst-cache
    files:
      recipe:
        - test.typ

about:
  license: MIT
  license_file:
    - LICENSE
  summary: Advanced scientific number formatting for Typst.
  homepage: https://typst.app/universe/package/zero
  repository: https://github.com/Mc-Zen/zero

extra:
  recipe-maintainers:
    - MarkusJungQC
